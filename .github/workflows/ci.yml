name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
  NEXT_PUBLIC_SITE_URL: "https://example.invalid"
  JWT_SECRET: "ci-only-session-secret-0123456789abcdef"
  TURNSTILE_SITE_KEY: "ci-site-key"
  TURNSTILE_SECRET_KEY: "ci-secret-key"

jobs:
  # ─── Lint & Type Check ──────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Test K3s deployment failure handling
        run: python3 -m unittest discover -s deploy/k3s/tests -v
      - run: npm audit --audit-level=high

  # ─── Build ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  # ─── E2E Tests ──────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      
      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up --build -d --wait

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-reports/
          retention-days: 14

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Docker Build & Push ────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      app-digest: ${{ steps.build-app.outputs.digest }}
      migration-digest: ${{ steps.build-migrate.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://phao.dev' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: image
        shell: bash
        run: |
          image_ref="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          latest_ref="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "ref=${image_ref,,}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest_ref,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build-app
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            DATABASE_URL=${{ env.DATABASE_URL }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
          sbom: true
          provenance: mode=max

      - name: Build and push migration tooling
        id: build-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository }}:migrate-${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          sbom: true
          provenance: mode=max

  deploy:
    name: Deploy to K3s
    runs-on: [self-hosted, linux, portfolio-production-deploy]
    timeout-minutes: 20
    needs: [docker, test-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Deploy immutable images and verify production
        env:
          APP_DIGEST: ${{ needs.docker.outputs.app-digest }}
          MIGRATION_DIGEST: ${{ needs.docker.outputs.migration-digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/portfolio-deploy "$APP_DIGEST" "$MIGRATION_DIGEST" "$REVISION"
      - name: Summarize deployment
        env:
          REVISION: ${{ github.sha }}
        run: |
          echo "Deployed $REVISION to portfolio on k3s-01; verified https://phao.dev/v1/api/health" >> "$GITHUB_STEP_SUMMARY"
