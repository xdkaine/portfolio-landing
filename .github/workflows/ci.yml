name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
  NEXT_PUBLIC_SITE_URL: "https://example.invalid"
  JWT_SECRET: "ci-only-session-secret-0123456789abcdef"
  TURNSTILE_SITE_KEY: "ci-site-key"
  TURNSTILE_SECRET_KEY: "ci-secret-key"

jobs:
  # ─── Lint & Type Check ──────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Test K3s deployment failure handling
        run: python3 -m unittest discover -s deploy/k3s/tests -v
      - run: npm audit --audit-level=high

  # ─── Build ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  # ─── E2E Tests ──────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      
      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up --build -d --wait

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-reports/
          retention-days: 14

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Docker Build & Push ────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      app-digest: ${{ steps.build-app.outputs.digest }}
      migration-digest: ${{ steps.build-migrate.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://phao.dev' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: image
        shell: bash
        run: |
          image_ref="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          latest_ref="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "ref=${image_ref,,}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest_ref,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build-app
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            DATABASE_URL=${{ env.DATABASE_URL }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
          sbom: true
          provenance: mode=max

      - name: Build and push migration tooling
        id: build-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository }}:migrate-${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          sbom: true
          provenance: mode=max

  publish:
    name: Publish release and verify rollout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker, test-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_DIGEST: ${{ needs.docker.outputs.app-digest }}
      MIGRATION_DIGEST: ${{ needs.docker.outputs.migration-digest }}
    steps:
      - name: Publish a tested release for the VM to pull
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$current" = "$GITHUB_SHA" || { echo "A newer main commit exists; refusing stale publication"; exit 1; }
          python3 - <<'PY'
          import json, os, re
          for key in ['APP_DIGEST','MIGRATION_DIGEST']:
              assert re.fullmatch(r'sha256:[0-9a-f]{64}',os.environ[key])
          release={'schema':1,'repository':os.environ['GITHUB_REPOSITORY'],'revision':os.environ['GITHUB_SHA'],'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'appDigest':os.environ['APP_DIGEST'],'migrationDigest':os.environ['MIGRATION_DIGEST']}
          with open('release.json','w') as f: json.dump(release,f,indent=2)
          PY
          tag="production-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release.json --target "$GITHUB_SHA" --draft --title "Production ${GITHUB_SHA:0:12}" --notes "Tested immutable images for the portfolio pull-based deployment."
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag; waiting for the VM to pull and deploy it." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the public production revision
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          deadline=time.monotonic()+900
          while time.monotonic()<deadline:
              try:
                  req=urllib.request.Request('https://phao.dev/v1/api/health',headers={'User-Agent':'portfolio-deploy/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r: health=json.load(r)
                  if health.get('status')=='ok' and health.get('revision')==os.environ['GITHUB_SHA']:
                      print('Verified production release',os.environ['GITHUB_SHA'])
                      break
              except Exception as error:
                  print('Production health check pending:',type(error).__name__)
              time.sleep(15)
          else:
              raise SystemExit('The VM did not deploy this release; inspect portfolio-pull.service on k3s-01')
          PY
