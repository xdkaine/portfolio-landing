name: Local CI/CD
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test-deploy:
    runs-on: [self-hosted, Linux, X64, portfolio-local]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build, test and deploy on the VM
        env:
          LOCAL_CI_KEY: portfolio
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://phao.dev' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: k3s-ci-job python3 deploy/k3s/local-ci.py
